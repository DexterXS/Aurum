<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <title>Aurum — Личные финансы</title>
    <meta
      name="description"
      content="Aurum — самостоятельно размещаемая система учёта личных финансов: денежный поток, чистый капитал, бюджеты, подписки, активы и все источники дохода в одном месте."
    />
    <meta
      name="keywords"
      content="личные финансы, учёт финансов, семейный бюджет, self-hosted, денежный поток, чистый капитал, бюджет, трекер расходов, финансовый трекер, crypto tracker"
    />
    <meta name="author" content="Aurum" />
    <!-- Self-hosted app without a fixed public domain, so og:url/og:image
         are left out — each deployment would need its own values. -->
    <meta property="og:title" content="Aurum — Личные финансы" />
    <meta
      property="og:description"
      content="Самостоятельно размещаемая система учёта личных финансов: денежный поток, чистый капитал, бюджеты, подписки и активы."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Aurum — Личные финансы" />
    <meta
      name="twitter:description"
      content="Самостоятельно размещаемая система учёта личных финансов: денежный поток, чистый капитал, бюджеты, подписки и активы."
    />
    <!-- Runs before the first paint to avoid a wrong-theme flash. Kept in its
         own file (public/theme-init.js), not inline, so the CSP in
         frontend/nginx.conf can forbid inline scripts entirely. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
